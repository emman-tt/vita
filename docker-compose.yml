services:
  vita:
    image: ghcr.io/emman-tt/vita:latest 
    container_name: vita
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s