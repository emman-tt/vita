<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59391a"/>
      <stop offset="0.32" stop-color="#8a5a28"/>
      <stop offset="0.62" stop-color="#6b4218"/>
      <stop offset="1" stop-color="#452a0e"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- dropper cap -->
  <rect x="129" y="6" width="42" height="54" rx="19" fill="url(#cap)"/>
  <rect x="115" y="56" width="70" height="36" rx="9" fill="#151515"/>
  <!-- neck -->
  <rect x="127" y="92" width="46" height="34" fill="#3c2608"/>
  <rect x="133" y="96" width="8" height="26" rx="4" fill="#241604"/>

  <!-- glass body -->
  <path d="M80 126 H220 Q252 126 252 158 V478 Q252 522 208 522 H92 Q48 522 48 478 V158 Q48 126 80 126 Z" fill="url(#glass)"/>
  <rect x="60" y="150" width="12" height="340" rx="6" fill="#ffffff" opacity="0.14"/>
  <rect x="228" y="150" width="8" height="340" rx="4" fill="#ffffff" opacity="0.08"/>

  <!-- label -->
  <rect x="64" y="196" width="172" height="232" rx="10" fill="#F4651F"/>
  <text x="150" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#ffffff">VITA</text>
  <text x="150" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="2" fill="#ffd9bd">NATURAL &amp; HEALTHY</text>
  <text x="150" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="34" fill="#ffffff">Vitamin C</text>
  <text x="150" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#ffe7d4">+ Hyaluronic Acid</text>
  <rect x="110" y="328" width="80" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="1.4"/>
  <text x="150" y="346" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#ffffff">SERUM</text>
  <text x="150" y="372" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="8.5" fill="#ffd9bd">Glycyrrhiza Glabra Root</text>
  <text x="150" y="384" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="8.5" fill="#ffd9bd">Rose Canina Fruit</text>
  <text x="150" y="414" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.5" fill="#ffe7d4">1oz / 30ml &#8474;</text>
</svg>
